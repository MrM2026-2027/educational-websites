<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Educational Websites</title>
<meta name="description" content="Interactive learning websites by Mr Miles.">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#15112a);--ink:light-dark(#1d1534,#f3efff);--mute:light-dark(#5e5377,#b8acd6);--line:light-dark(#ddd3ef,#3b3163);--pen:light-dark(#4b2c83,#cdb6ff)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Andika,system-ui,sans-serif}
header{background:#4b2c83;color:#fff;padding:40px max(5vw,16px)}
h1{font:800 clamp(34px,6vw,56px)/1.05 "Baloo 2",sans-serif;margin:0}
h1 span{color:#ffcf33}
header p{margin:8px 0 0;opacity:.85}
main{max-width:1000px;margin:auto;padding:28px max(5vw,16px) 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:inherit;border:3px solid var(--line);border-radius:22px;padding:22px;transition:border-color .2s,transform .2s}
a.card:hover,a.card:focus-visible{border-color:#ffcf33;transform:translateY(-3px);outline:none}
.badge{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:16px;background:#4b2c83;color:#ffcf33;font:800 24px "Baloo 2",sans-serif}
h2{font:800 26px/1.1 "Baloo 2",sans-serif;color:var(--pen);margin:14px 0 6px}
.card p{margin:0;color:var(--mute)}
@media(prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
</head>
<body>
<header><h1>Educational <span>Websites</span></h1><p>Interactive learning by Mr Miles</p></header>
<main>
<a class="card" href="maths1a/"><span class="badge">1A</span><h2>Maths 1A Playground</h2><p>Grade 1 maths: word problem detective, numbers to 20, number bonds, adding and subtracting, shapes, position and length, with a quiz in every section.</p></a>
</main>
</body>
</html>
